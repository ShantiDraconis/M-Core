name: P01 T1D Recovery Parallel

on:
  workflow_dispatch:
  push:
    branches:
      - atk/p01-t1d-recovery-workflow-20260924
    paths:
      - 'imports/pnp/**'
      - 'lean/**'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - '.github/workflows/p01-t1d-recovery-parallel.yml'

permissions:
  contents: read

env:
  P01_RECOVERY: imports/pnp/44e3327a/lean/MCore/Real

jobs:
  source-recovery:
    name: T1D-0 Source Recovery Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovered T1D sources
        shell: bash
        run: |
          set -euo pipefail
          for f in             P01FullVerifierPhysical.lean             P01IntegratedMachine.lean             P01ConstructionClose.lean
          do
            test -f "$P01_RECOVERY/$f" || {
              echo "::error::$P01_RECOVERY/$f missing"
              exit 1
            }
          done
          grep -n 'structure PhysicalVerifierRealization'             "$P01_RECOVERY/P01FullVerifierPhysical.lean"
          grep -n 'IntegratedPhaseBridgeCertificate'             "$P01_RECOVERY/P01IntegratedMachine.lean"
          grep -n 'IntegratedSATNTMConstruction'             "$P01_RECOVERY/P01ConstructionClose.lean"

  physical-verifier:
    name: T1D-1 Physical Verifier
    needs: source-recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PNP Lean workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean
          # Historical T1-D base from m-core-p-vs-np@cf885872.
          cp -a imports/pnp/cf885872/lean/. lean/
          # Overlay every other recovered snapshot, preserving newer M-Core work.
          while IFS= read -r d; do
            [ "$d" = "imports/pnp/cf885872/lean" ] && continue
            cp -a "$d"/. lean/
          done < <(find imports/pnp -mindepth 2 -maxdepth 2 -type d -name lean | sort)
          test -f lean/MCore/Real/P01FullVerifierPhysical.lean
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Build physical verifier
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.Real.P01FullVerifierPhysical

  integrated-machine:
    name: T1D-2 Integrated Machine
    needs: physical-verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PNP Lean workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean
          # Historical T1-D base from m-core-p-vs-np@cf885872.
          cp -a imports/pnp/cf885872/lean/. lean/
          # Overlay every other recovered snapshot, preserving newer M-Core work.
          while IFS= read -r d; do
            [ "$d" = "imports/pnp/cf885872/lean" ] && continue
            cp -a "$d"/. lean/
          done < <(find imports/pnp -mindepth 2 -maxdepth 2 -type d -name lean | sort)
          test -f lean/MCore/Real/P01IntegratedMachine.lean
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build MCore.Real.P01IntegratedMachine

  construction-close:
    name: T1D-3 P01 Construction Close
    needs: integrated-machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct PNP Lean workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean
          # Historical T1-D base from m-core-p-vs-np@cf885872.
          cp -a imports/pnp/cf885872/lean/. lean/
          # Overlay every other recovered snapshot, preserving newer M-Core work.
          while IFS= read -r d; do
            [ "$d" = "imports/pnp/cf885872/lean" ] && continue
            cp -a "$d"/. lean/
          done < <(find imports/pnp -mindepth 2 -maxdepth 2 -type d -name lean | sort)
          test -f lean/MCore/Real/P01ConstructionClose.lean
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake build MCore.Real.P01ConstructionClose

  hygiene:
    name: T1D-4 Fail-Closed Hygiene
    needs: construction-close
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof placeholders in recovered P01 lane
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\\b(sorry|admit)\\b'             imports/pnp/*/lean/MCore/Real/P01*.lean
          then
            echo "::error::proof placeholder detected"
            exit 1
          fi
          echo "T1D GREEN candidate: recovered sources build and hygiene passed"

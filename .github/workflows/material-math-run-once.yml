name: Material mathematics kernel one-shot

on:
  push:
    branches:
      - atk/material-mathematics-kernel-20261001
    paths:
      - audit/MATERIAL_MATH_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Source hygiene
        run: |
          set -euo pipefail
          FILES=(
            lean/MCore/MaterialMath/TriCyclicAlgebra.lean
            lean/MCore/MaterialMath/TriCyclicCalculus.lean
            lean/MCore/MaterialMath/TriCyclicDecomposition.lean
            lean/MCore/MaterialMath/TriCyclicGeometry.lean
            lean/MCore/MaterialMath/OperatorLaws.lean
          )
          ! grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' "${FILES[@]}"
      - name: Build material mathematics stack
        run: |
          set -euo pipefail
          lake build MCore.MaterialMath.TriCyclicAlgebra
          lake build MCore.MaterialMath.TriCyclicCalculus
          lake build MCore.MaterialMath.TriCyclicDecomposition
          lake build MCore.MaterialMath.TriCyclicGeometry
          lake build MCore.MaterialMath.OperatorLaws
      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/material_math_audit.lean <<'EOF'
          import MCore.MaterialMath.OperatorLaws
          #print axioms MCore.MaterialMath.TriNumber.rotate_three
          #print axioms MCore.MaterialMath.TriNumber.cyclicMul_assoc
          #print axioms MCore.MaterialMath.TriNumber.cyclicMul_comm
          #print axioms MCore.MaterialMath.TriNumber.torsion_skew
          #print axioms MCore.MaterialMath.TriNumber.spread_rotate
          #print axioms MCore.MaterialMath.TriNumber.phaseDerivative_eq_zero_iff_balanced
          #print axioms MCore.MaterialMath.TriNumber.spread_eq_zero_iff_balanced
          #print axioms MCore.MaterialMath.TriNumber.balanced_add_fluctuation
          #print axioms MCore.MaterialMath.TriNumber.balanced_and_zeroSum_eq_zero
          #print axioms MCore.MaterialMath.TriNumber.balanced_transverse_decomposition_unique
          #print axioms MCore.MaterialMath.SingularResolution.rotate_three
          #print axioms MCore.MaterialMath.TriNumber.spread_identity
          #print axioms MCore.MaterialMath.TriNumber.torsion_fluctuation
          #print axioms MCore.MaterialMath.TriNumber.spread_eq_three_transverseRadiusSq
          #print axioms MCore.MaterialMath.rotate_periodic3
          #print axioms MCore.MaterialMath.rotate_energy_preserving
          #print axioms MCore.MaterialMath.rotate_fixed_iff_balanced
          #print axioms MCore.MaterialMath.TerminalMaterialAdapters.toGlobalPositiveRoot
          #print axioms MCore.MaterialMath.FormalRatio.zeroOverZero_not_evaluable
          EOF
          lake env lean /tmp/material_math_audit.lean | tee audit/MATERIAL_MATH_AXIOMS.log
          ! grep -q 'sorryAx' audit/MATERIAL_MATH_AXIOMS.log
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-math-${{ github.sha }}
          path: audit/MATERIAL_MATH_AXIOMS.log
          if-no-files-found: warn

name: Global material frontier strict certify

on:
  push:
    branches:
      - atk/global-material-frontier-20261001
    paths:
      - audit/GLOBAL_MATERIAL_STRICT_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lean --version
          lake --version
          lake update
          lake exe cache get

      - name: Strict source hygiene
        run: |
          set -euo pipefail
          FILES=(
            lean/MCore/FinalFail/BoundaryAtoms.lean
            lean/MCore/FinalFail/Semantic/Riemann.lean
            lean/MCore/FinalFail/Semantic/Beal.lean
            lean/MCore/FinalFail/Semantic/PvsNP.lean
            lean/MCore/FinalFail/Semantic/NavierStokes.lean
            lean/MCore/FinalFail/Semantic/Hodge.lean
            lean/MCore/FinalFail/Semantic/BSD.lean
            lean/MCore/FinalFail/Semantic/YangMills.lean
            lean/MCore/FinalFail/AcceptedSemanticActivation.lean
            lean/MCore/FinalFail/SemanticParallel.lean
            lean/MCore/FinalFail/GlobalConditionalFinal.lean
            lean/MCore/FinalFail/GlobalPositiveMaterialFrontier.lean
          )
          if grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' "${FILES[@]}"; then
            echo "ERROR: prohibited proof escape found"
            exit 1
          fi
          test "$(grep -c 'orientation := ' lean/MCore/FinalFail/SemanticParallel.lean)" -eq 7
          test "$(grep -c 'orientation := .positive' lean/MCore/FinalFail/SemanticParallel.lean)" -eq 6
          test "$(grep -c 'orientation := .refutational' lean/MCore/FinalFail/SemanticParallel.lean)" -eq 1

      - name: Build complete semantic module
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.SemanticParallel
          lake build MCore.FinalFail.GlobalConditionalFinal
          lake build MCore.FinalFail.GlobalPositiveMaterialFrontier

      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/global_material_strict_audit.lean <<'EOF'
          import MCore.FinalFail.GlobalPositiveMaterialFrontier
          #print axioms MCore.FinalFail.Semantic.globalConditionalFinalRoot_implies_not_RH
          #print axioms MCore.FinalFail.Semantic.beal_target_iff_gcd_lower_bound
          #print axioms MCore.FinalFail.Semantic.pvsnp_target_iff_sat_np_and_not_p
          #print axioms MCore.FinalFail.Semantic.ns_target_iff_exists_universal_stabilizer
          #print axioms MCore.FinalFail.Semantic.hodge_target_iff_pointwise_realization
          #print axioms MCore.FinalFail.Semantic.bsd_target_iff_rank_and_refined
          #print axioms MCore.FinalFail.Semantic.ym_target_iff_exists_physical_theory
          #print axioms MCore.FinalFail.Semantic.rh_excludes_offCriticalZero
          #print axioms MCore.FinalFail.Semantic.positive_rh_incompatible_with_negative_lane
          #print axioms MCore.FinalFail.Semantic.global_positive_root_iff_components
          #print axioms MCore.FinalFail.Semantic.positive_root_excludes_mixed_negative_root
          #print axioms MCore.FinalFail.Semantic.build_global_positive_material_root
          EOF
          lake env lean /tmp/global_material_strict_audit.lean | tee audit/GLOBAL_MATERIAL_STRICT_AXIOMS.log
          ! grep -q 'sorryAx' audit/GLOBAL_MATERIAL_STRICT_AXIOMS.log

      - name: Upload strict audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-material-strict-${{ github.sha }}
          path: audit/GLOBAL_MATERIAL_STRICT_AXIOMS.log
          if-no-files-found: warn

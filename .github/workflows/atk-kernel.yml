name: ATK kernel check (lemas + condicionais)

on:
  push:
    paths:
      - 'atk-kernel/**'
      - '.github/workflows/atk-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: Lean 4 + Mathlib — compilação e auditoria de axiomas
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: atk-kernel
    steps:
      - uses: actions/checkout@v4

      - name: Liberar disco do runner
        shell: bash
        run: |
          df -h / | tail -1
          # a verificação de fiação copia o build do ATK; o disco padrão do runner não comporta mais
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          df -h / | tail -1

      - name: Instalar elan (gerenciador do Lean)
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Versões
        shell: bash
        run: |
          mkdir -p reports
          lean --version | tee reports/toolchain.txt
          lake --version

      - name: Baixar Mathlib já compilada (cache oficial)
        shell: bash
        run: |
          lake exe cache get || (lake update && lake exe cache get)

      - name: lake build
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          lake build 2>&1 | tee reports/build.log

      - name: "Auditoria por arquivo (kernel + #print axioms)"
        shell: bash
        run: |
          : > reports/file_status.txt
          # auditoria em paralelo (4 processos): cada arquivo é reverificado pelo kernel com #print axioms
          shopt -s nullglob
          arquivos=(ATK/*.lean ATK/Conditional/*.lean ATK/Terminal/*.lean ATK/Cert/*.lean ATK/ZeroClasses/*.lean)
          printf '%s\n' "${arquivos[@]}" \
            | xargs -P 4 -I{} bash -c 'f="{}"; m=${f#ATK/}; m=${m%.lean}; m=${m//\//_};
                if lake env lean "$f" > "reports/audit_${m}.log" 2>&1; then echo "$f OK"; else echo "$f FAIL"; fi' \
            > reports/file_status.unsorted
          sort reports/file_status.unsorted > reports/file_status.txt
          cat reports/file_status.txt
          # os logs brutos não são legíveis de fora: os primeiros erros dos arquivos que falham viram anotações
          { grep " FAIL$" reports/file_status.txt || true; } | while read -r f _; do
            m=${f#ATK/}; m=${m%.lean}; m=${m//\//_}
            { grep -E "error" "reports/audit_${m}.log" || true; } | head -2 | while IFS= read -r l; do
              echo "::error title=${f}::${l:0:900}"
            done
          done
          cp lake-manifest.json reports/ || true

      - name: Relatório de certificação
        id: report
        shell: bash
        run: |
          set +e
          python3 scripts/check_axioms.py
          code=$?
          cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atk-kernel-report
          path: atk-kernel/reports/

  numerics:
    name: RH — D_N real (Nyman–Beurling / Báez-Duarte)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar Gram (Vasyunin × integração direta) e b_k
        working-directory: atk-kernel/numerics
        run: |
          python3 verify_vasyunin.py | tee verify_vasyunin.ci.log
          python3 check_b.py | tee check_b.ci.log
      - name: D_N para N ≤ 300 em 40 e 60 dígitos
        working-directory: atk-kernel/numerics
        run: |
          python3 run_dn.py 300 40 dn_ci_p40.csv
          python3 run_dn.py 300 60 dn_ci_p60.csv
          python3 analyze.py dn_ci_p40.csv dn_ci_p60.csv | tee analyze.ci.log
          {
            echo "## RH — D_N real (N ≤ 300, reprodução no CI)"
            echo '```'
            cat analyze.ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atk-rh-numerics
          path: atk-kernel/numerics/*.ci.log

name: Seven terminal parameter law targeted build

on:
  push:
    branches:
      - 'atk/seven-terminal-parameter-law'
    paths:
      - 'lean/MCore/FinalFail/SevenTerminalParameterLaw.lean'
      - 'lean/MCore.lean'
      - '.github/workflows/seven-terminal-parameter-law-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Build seven terminal parameter law
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.FinalFail.SevenTerminalParameterLaw

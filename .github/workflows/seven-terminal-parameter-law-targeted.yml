name: Seven terminal parameter law targeted build

on:
  push:
    branches:
      - 'atk/seven-terminal-parameter-law'
    paths:
      - 'lean/MCore/FinalFail/SevenTerminalParameterLaw.lean'
      - 'lean/MCore.lean'
      - '.github/workflows/seven-terminal-parameter-law-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: MCore.FinalFail.SevenTerminalParameterLaw

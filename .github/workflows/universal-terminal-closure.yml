name: Universal Terminal Closure

on:
  push:
    branches:
      - atk/universal-terminal-closure-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Setup Lean
        run: |
          elan toolchain install $(cat lean-toolchain)
          elan default $(cat lean-toolchain)
      - name: Dependencies
        run: |
          lake update
          lake exe cache get || true
      - name: Build universal closure
        run: lake build MCore.UniversalTerminalClosure
      - name: Validate wrapper equivalence registry
        run: |
          python3 -m json.tool master-terminal/wrapper_equivalence_registry.json >/dev/null
          python3 scripts/wrapper_equivalence_audit.py
      - name: Verify external issuance remains fail-closed
        run: |
          python3 scripts/generate_external_terminal_certificate.py --expect-blocked
      - name: Source firewall
        run: |
          set -euo pipefail
          FILE=lean/MCore/UniversalTerminalClosure.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|axiom)([^[:alnum:]_]|$)' "$FILE"

name: ATK legacy kernel check

on:
  push:
    paths:
      - 'atk-legacy/**'
      - '.github/workflows/atk-legacy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy:
    name: Arquivos Lean originais (v4.21.0) — kernel e axiomas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: atk-legacy
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Instalar elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib v4.21.0 (cache)
        run: |
          lean --version
          lake exe cache get || (lake update && lake exe cache get)
      - name: Compilar e auditar os originais
        run: python3 scripts/check_legacy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atk-legacy-report
          path: atk-legacy/reports/

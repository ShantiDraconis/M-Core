name: Material derived one-shot

on:
  push:
    branches:
      - atk/global-material-frontier-20261001
    paths:
      - audit/MATERIAL_DERIVED_RUN_ONCE

permissions:
  contents: read

concurrency:
  group: material-derived-one-shot
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Source hygiene
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' \
            lean/MCore/FinalFail/MaterialProducerCalculus.lean \
            lean/MCore/FinalFail/MaterialDerived.lean \
            lean/MCore/FinalFail/MaterialGlobalAssembly.lean \
            lean/MCore/FinalFail/MaterialField.lean
      - name: Build material derived
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.MaterialDerived
          lake build MCore.FinalFail.MaterialGlobalAssembly
          lake build MCore.FinalFail.MaterialField
      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/material_derived_audit.lean <<'EOF'
          import MCore.FinalFail.MaterialDerived
          #print axioms MCore.FinalFail.MaterialDerived.TriState.code_add_mod_three
          #print axioms MCore.FinalFail.MaterialDerived.TriState.code_mul_mod_three
          #print axioms MCore.FinalFail.MaterialDerived.TriState.mul_eq_zero_iff
          #print axioms MCore.FinalFail.MaterialDerived.TriState.mul_left_cancel_nonzero
          #print axioms MCore.FinalFail.MaterialDerived.TriState.characteristic_three
          #print axioms MCore.FinalFail.MaterialDerived.TriState.orbit_three_step
          #print axioms MCore.FinalFail.MaterialDerived.SevenLaneVector.smul_add
          #print axioms MCore.FinalFail.MaterialDerived.SevenLaneVector.add_smul
          #print axioms MCore.FinalFail.MaterialDerived.EvidenceState.closure_idempotent
          #print axioms MCore.FinalFail.MaterialDerived.EvidenceState.interior_idempotent
          #print axioms MCore.FinalFail.MaterialDerived.EvidenceState.proven_boundary_iff_not_proved
          #print axioms MCore.FinalFail.MaterialDerived.EvidenceState.derivative_two_step
          #print axioms MCore.FinalFail.MaterialDerived.negateProducer
          #print axioms MCore.FinalFail.MaterialGlobalAssembly.SevenMaterialProducers.toPositiveRoot
          #print axioms MCore.FinalFail.MaterialGlobalAssembly.producer_root_roundtrip
          #print axioms MCore.FinalFail.MaterialGlobalAssembly.producers_force_proved_evidence
          #print axioms MCore.FinalFail.MaterialField.TriState.fieldCertificate
          #print axioms MCore.FinalFail.MaterialField.TriState.field_characteristic_three
          #print axioms MCore.FinalFail.MaterialField.TriState.tristate_is_three_element_field_table
          EOF
          lake env lean /tmp/material_derived_audit.lean | tee audit/MATERIAL_DERIVED_AXIOMS.log
          ! grep -q 'sorryAx' audit/MATERIAL_DERIVED_AXIOMS.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-derived-${{ github.sha }}
          path: audit/MATERIAL_DERIVED_AXIOMS.log
          if-no-files-found: warn

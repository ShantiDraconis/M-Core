name: M-Core CI

on:
  push:
    branches:
      - main
      - python-audit
      - rh-certificates
      - research/rh-mcore-certification
      - research/rh-certificates
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: Python audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Compile Python sources
        run: python -m compileall -q python adapters tests/python
      - name: Run Python audit gates
        run: python -m pytest tests/python -vv

  lean-build:
    name: Lean formal build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build M-Core
        run: lake build
      - name: Reject Lean placeholders
        run: |
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' MCore MCore.lean --include='*.lean'; then
            echo 'Unresolved Lean placeholder found.'
            exit 1
          fi
      - name: RH scientific firewall
        run: |
          set -eu
          if grep -RInE 'theorem[[:space:]][^:]+:[[:space:]]*True([[:space:]]|$)' MCore/RH --include='*.lean'; then
            echo 'VACUOUS_TRUE theorem found in RH modules.'
            exit 1
          fi
          if grep -RInE 'def[[:space:]]+deBruijnNewmanConstant[^:]*:[[:space:]]*ℝ[[:space:]]*:=[[:space:]]*0([[:space:]]|$)' MCore/RH --include='*.lean'; then
            echo 'Hard-coded de Bruijn-Newman constant found.'
            exit 1
          fi
          grep -Rqs 'targetProved := false' MCore/RH/Certificate.lean
          grep -Rqs 'noHiddenGaps := true' MCore/RH/Certificate.lean
          grep -Rqs 'structure ApproximationDatum' MCore/RH/ResearchObligations.lean
          grep -Rqs 'def PositiveScale' MCore/RH/GeometryDynamics.lean
          grep -Rqs 'inductive EvidenceStatus' MCore/RH/Status.lean

name: Material stack one-shot

on:
  push:
    branches:
      - atk/global-material-frontier-20261001
    paths:
      - audit/MATERIAL_STACK_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Source hygiene
        run: |
          set -euo pipefail
          FILES=(
            lean/MCore/FinalFail/MaterialAlgebra.lean
            lean/MCore/FinalFail/MaterialProducerCalculus.lean
            lean/MCore/FinalFail/MaterialDerived.lean
            lean/MCore/FinalFail/MaterialGeometry.lean
            lean/MCore/FinalFail/MaterialGlobalAssembly.lean
            lean/MCore/FinalFail/MaterialField.lean
            lean/MCore/FinalFail/TopologyOperatorCore.lean
          )
          if grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' "${FILES[@]}"; then
            echo "ERROR: prohibited proof escape found"
            exit 1
          fi
      - name: Build material stack
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.MaterialAlgebra
          lake build MCore.FinalFail.MaterialProducerCalculus
          lake build MCore.FinalFail.MaterialDerived
          lake build MCore.FinalFail.MaterialGeometry
          lake build MCore.FinalFail.MaterialGlobalAssembly
          lake build MCore.FinalFail.MaterialField
          lake build MCore.FinalFail.TopologyOperatorCore
      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/material_stack_audit.lean <<'EOF'
          import MCore.FinalFail.MaterialGlobalAssembly
          import MCore.FinalFail.MaterialGeometry
          import MCore.FinalFail.MaterialField
          import MCore.FinalFail.TopologyOperatorCore
          #print axioms MCore.FinalFail.MaterialDerived.TriState.code_add_mod_three
          #print axioms MCore.FinalFail.MaterialDerived.TriState.mul_eq_zero_iff
          #print axioms MCore.FinalFail.MaterialDerived.SevenLaneVector.smul_add
          #print axioms MCore.FinalFail.MaterialDerived.EvidenceState.closure_idempotent
          #print axioms MCore.FinalFail.MaterialGeometry.TriState.rho_three
          #print axioms MCore.FinalFail.MaterialGeometry.SevenLaneVector.hamming_eq_zero_iff
          #print axioms MCore.FinalFail.MaterialGeometry.EvidenceState.secondDerivative_bounds
          #print axioms MCore.FinalFail.MaterialGlobalAssembly.producer_root_roundtrip
          #print axioms MCore.FinalFail.MaterialField.TriState.fieldCertificate
          #print axioms MCore.FinalFail.MaterialField.TriState.tristate_is_three_element_field_table
          #print axioms MCore.FinalFail.Triad.bi_retraction_not_defect
          #print axioms MCore.FinalFail.Triad.bi_retraction_implies_fixed
          EOF
          lake env lean /tmp/material_stack_audit.lean | tee audit/MATERIAL_STACK_AXIOMS.log
          ! grep -q 'sorryAx' audit/MATERIAL_STACK_AXIOMS.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-stack-${{ github.sha }}
          path: audit/MATERIAL_STACK_AXIOMS.log
          if-no-files-found: warn

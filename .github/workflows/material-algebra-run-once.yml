name: Material algebra one-shot

on:
  push:
    branches:
      - atk/global-material-frontier-20261001
    paths:
      - audit/MATERIAL_ALGEBRA_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Hygiene
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' lean/MCore/FinalFail/MaterialAlgebra.lean
      - name: Build material algebra
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.MaterialAlgebra
      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/material_algebra_audit.lean <<'EOF'
          import MCore.FinalFail.MaterialAlgebra
          #print axioms MCore.FinalFail.MaterialAlgebra.Producer.map_comp
          #print axioms MCore.FinalFail.MaterialAlgebra.Residual.and_proposition
          #print axioms MCore.FinalFail.MaterialAlgebra.Residual.or_proposition
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.rotate_three
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.add_comm
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.add_assoc
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.mul_comm
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.mul_assoc
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.left_distrib
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.right_distrib
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.mul_inv_cancel
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.cubic_idempotence
          #print axioms MCore.FinalFail.MaterialAlgebra.SevenLaneVector.add_comm
          #print axioms MCore.FinalFail.MaterialAlgebra.SevenLaneVector.add_assoc
          #print axioms MCore.FinalFail.MaterialAlgebra.global_frontier_is_seven_component_product
          EOF
          lake env lean /tmp/material_algebra_audit.lean | tee audit/MATERIAL_ALGEBRA_AXIOMS.log
          ! grep -q 'sorryAx' audit/MATERIAL_ALGEBRA_AXIOMS.log
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-algebra-${{ github.sha }}
          path: audit/MATERIAL_ALGEBRA_AXIOMS.log
          if-no-files-found: warn

name: Sync certified inventory
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'audit/closure-calculus-20261125'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/closure-calculus-20261125
      - name: Retrieve and verify certified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/14992847574/zip > /tmp/inventory.zip
          echo 'bd30c4a359ba8fbb7fbde34e193e68d9ad3026ed16076a0997e8a43c6a8a73d9  /tmp/inventory.zip' | sha256sum -c
          git diff --exit-code c39c69830c854f37afa3ef4f6300370adb74b91d HEAD -- lean atk-kernel scripts/proof_inventory.py lean-toolchain lakefile.lean lakefile.toml lake-manifest.json
          unzip -p /tmp/inventory.zip PROOF_INVENTORY.json > inventory/PROOF_INVENTORY.json
          unzip -p /tmp/inventory.zip PROOF_INVENTORY.md > inventory/PROOF_INVENTORY.md
          git add inventory/PROOF_INVENTORY.json inventory/PROOF_INVENTORY.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize kernel-derived proof inventory (artifact 14992847574)'
          git push origin HEAD:audit/closure-calculus-20261125

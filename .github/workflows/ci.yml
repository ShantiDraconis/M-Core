name: M-Core CI

on:
  push:
    branches: [main, python-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: Python audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Compile Python sources
        run: python -m compileall -q python adapters tests/python
      - name: Run Python audit gates
        run: python -m pytest tests/python -vv

  lean-build:
    name: Lean formal build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build M-Core
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee /tmp/mcore-build.log
      - name: Reject sorry in M-Core source
        # O grep anterior marcava a palavra em docstrings ("no-sorry"); ver audit/testes_portao/.
        run: |
          python3 .github/scripts/sem_sorry.py MCore MCore.lean lean
          if grep -E "declaration uses .sorry." /tmp/mcore-build.log; then
            echo 'O elaborador achou sorry numa declaração compilada.'
            exit 1
          fi
      - name: K15 audit actual axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          # A árvore MCore/ da raiz (o núcleo K15) não entra no `lake build` (srcDir := "lean"): compila à parte.
          lake env python3 .github/scripts/compilar_raiz.py /tmp/k15
          lake env bash -c 'LEAN_PATH=/tmp/k15:$LEAN_PATH lean MCore/AxiomAudit.lean' 2>&1 | tee /tmp/mcore-axioms.log
          grep -q "depends on axioms\|does not depend on any axioms" /tmp/mcore-axioms.log
          if grep -q "error" /tmp/mcore-axioms.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('/tmp/mcore-axioms.log').read_text()
          allowed = {'propext', 'Quot.sound', 'Classical.choice'}
          used = set()
          for block in re.findall(r'depends on axioms:\s*\[(.*?)\]', text, flags=re.S):
              # separar por vírgula: o padrão anterior perdia o último nome de cada lista (`[sorryAx]` passava)
              used.update(a.strip() for a in block.replace('\n', ' ').split(',') if a.strip())
          unauthorized = sorted(used - allowed)
          print('K15 used axioms:', sorted(used))
          print('K15 allowed axioms:', sorted(allowed))
          if unauthorized:
              raise SystemExit('K15 unauthorized axioms: ' + ', '.join(unauthorized))
          print('K15 audit_untracked_axioms: PASS')
          PY

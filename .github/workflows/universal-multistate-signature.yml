name: Universal Multistate Signature

on:
  push:
    branches:
      - attack/universal-multistate-signature
    paths:
      - 'lean/MCore/FinalFail/UniversalMultiStateSignature.lean'
      - 'lean/MCore/FinalFail/UnifiedOpenMathClosure.lean'
      - 'lean/MCore/FinalFail/SevenMathematicalCores.lean'
      - '.github/workflows/universal-multistate-signature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multistate-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.19.0
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
      - name: Source hygiene
        run: |
          set -euo pipefail
          file=lean/MCore/FinalFail/UniversalMultiStateSignature.lean
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then exit 1; fi
          if grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$file"; then exit 1; fi
      - name: Kernel compile
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.UniversalMultiStateSignature MCore.FinalFail.UnifiedOpenMathClosure MCore.FinalFail.SevenMathematicalCores 2>&1 | tee /tmp/multistate.log
          if grep -q 'sorryAx' /tmp/multistate.log; then exit 1; fi
          echo 'UNIVERSAL_MULTISTATE_SIGNATURE=GREEN'


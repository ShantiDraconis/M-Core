name: riemann-open-math-scoped-final

on:
  push:
    branches:
      - open-math-scoped-final
  workflow_dispatch:

jobs:
  scoped_final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          cd imports/final-proof/RIEMANN/open-math-scoped-final/open-math
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd imports/final-proof/RIEMANN/open-math-scoped-final/open-math
          "$HOME/.elan/bin/lake" update
          "$HOME/.elan/bin/lake" exe cache get

      - name: Source firewall
        shell: bash
        run: |
          set -euo pipefail
          cd imports/final-proof/RIEMANN/open-math-scoped-final/open-math
          ! grep -RniE '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass)([^[:alnum:]_]|$)' Riemann --include='*.lean'
          ! grep -RniE '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' Riemann --include='*.lean'
          ! grep -RniE 'theorem[[:space:]]+(FINAL_PROOF|RiemannHypothesis)' Riemann/scoped

      - name: Build scoped claim
        shell: bash
        run: |
          set -euo pipefail
          cd imports/final-proof/RIEMANN/open-math-scoped-final/open-math
          "$HOME/.elan/bin/lake" build Riemann.scoped.FinalClaim

      - name: Check refuted route
        shell: bash
        run: |
          set -euo pipefail
          cd imports/final-proof/RIEMANN/open-math-scoped-final/open-math
          "$HOME/.elan/bin/lake" env lean Riemann/refuted-routes/A14NonImplication.lean

      - name: Certify scoped result
        shell: bash
        run: |
          set -euo pipefail
          cd imports/final-proof/RIEMANN/open-math-scoped-final/open-math
          bash certifica.sh
          echo "RIEMANN_OPEN_MATH_SCOPED_FINAL=GREEN"
          echo "RIEMANN_HYPOTHESIS_CLAIMS=0"

name: riemann-open-math-scoped-final

on:
  push:
    branches: [open-math-scoped-final]
    paths:
      - 'imports/final-proof/RIEMANN/open-math-scoped-final/open-math/**'
      - '.github/workflows/riemann-open-math-scoped-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-final:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: imports/final-proof/RIEMANN/open-math-scoped-final/open-math
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Resolve pinned dependencies
        run: |
          "$HOME/.elan/bin/lake" update
          "$HOME/.elan/bin/lake" exe cache get

      - name: Fail-closed source firewall
        run: |
          ! grep -RniE '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass)([^[:alnum:]_]|$)' Riemann --include='*.lean'
          ! grep -RniE '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' Riemann --include='*.lean'
          ! grep -RniE 'theorem[[:space:]]+(FINAL_PROOF|RiemannHypothesis)' Riemann/scoped

      - name: Build scoped final claim
        run: "$HOME/.elan/bin/lake" build Riemann.scoped.FinalClaim

      - name: Build countermodel-closed route
        run: "$HOME/.elan/bin/lake" env lean Riemann/refuted-routes/A14NonImplication.lean

      - name: Minimal certification
        run: bash certifica.sh

      - name: Scoped result
        run: |
          echo "R0=GREEN_6"
          echo "NB=GREEN_7"
          echo "AGGREG=GREEN_3"
          echo "R2=GREEN_2"
          echo "FINAL_SCOPED_CLAIM=GREEN"
          echo "RIEMANN_HYPOTHESIS_CLAIMS=0"
          echo "A14=CLOSED_BY_COUNTERMODEL_3"
          echo "EXTERNAL_FAIL_CLOSED=27ac66f4"

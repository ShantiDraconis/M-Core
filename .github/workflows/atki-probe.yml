name: Sonda BSD Euler

on:
  push:
    branches: ['atk/bsd-euler-*']
    paths: ['probe/**', '.github/workflows/atki-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: atk-kernel
    steps:
      - uses: actions/checkout@v4
      - name: elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: cache
        shell: bash
        run: lake exe cache get || (lake update && lake exe cache get)
      - name: deps
        shell: bash
        run: lake build ATK.BSDTamagawaE32 2>&1 | tail -3
      - name: sonda
        shell: bash
        run: |
          set +e
          cp ../probe/BSDEulerE32.lean ATK/BSDEulerE32.lean
          lake env lean ATK/BSDEulerE32.lean > p.log 2>&1; rc=$?
          grep -n "error" p.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          awk '/error/{f=1} f&&c<500{print; c++}' p.log > e.log
          split -l 14 -d e.log ch_
          for c in ch_*; do [ -f "$c" ] && echo "::warning::$(tr '\n' ' ' < "$c" | cut -c1-3500)"; done
          echo "::notice::axiomas=$(grep -c 'depends on axioms' p.log) sorry=$(grep -c sorryAx p.log) rc=$rc"
          exit $rc

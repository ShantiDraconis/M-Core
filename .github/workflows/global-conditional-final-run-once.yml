name: Global conditional final one-shot

on:
  push:
    branches:
      - atk/global-hypothesis-density-20261001
    paths:
      - audit/GLOBAL_CONDITIONAL_FINAL_RUN_ONCE

permissions:
  contents: read

concurrency:
  group: global-conditional-final-one-shot
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: false
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Build global conditional theorem
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.GlobalConditionalFinal
      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/global_conditional_audit.lean <<'EOF'
          import MCore.FinalFail.GlobalConditionalFinal
          #print axioms MCore.FinalFail.Semantic.globalAcceptedHypotheses_to_targets
          #print axioms MCore.FinalFail.Semantic.globalTargets_to_interpretations
          #print axioms MCore.FinalFail.Semantic.global_conditional_final
          EOF
          lake env lean /tmp/global_conditional_audit.lean | tee audit/GLOBAL_CONDITIONAL_FINAL_AXIOMS.log
          ! grep -q 'sorryAx' audit/GLOBAL_CONDITIONAL_FINAL_AXIOMS.log
      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-conditional-final-${{ github.sha }}
          path: audit/GLOBAL_CONDITIONAL_FINAL_AXIOMS.log
          if-no-files-found: warn

name: Material polynomial one-shot

on:
  push:
    branches:
      - atk/global-material-frontier-20261001
    paths:
      - audit/MATERIAL_POLYNOMIAL_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Source hygiene
        run: |
          set -euo pipefail
          FILE=lean/MCore/FinalFail/MaterialPolynomial.lean
          if grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' "$FILE"; then
            echo "ERROR: prohibited proof escape found"
            exit 1
          fi
      - name: Build polynomial material module
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.MaterialPolynomial
      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/material_polynomial_audit.lean <<'EOF'
          import MCore.FinalFail.MaterialPolynomial
          #print axioms MCore.FinalFail.MaterialPolynomial.TriState.every_unary_operator_is_quadratic
          #print axioms MCore.FinalFail.MaterialPolynomial.TriState.add_right_cancel
          #print axioms MCore.FinalFail.MaterialPolynomial.TriState.affine_comp
          #print axioms MCore.FinalFail.MaterialPolynomial.TriState.affine_bijective
          #print axioms MCore.FinalFail.MaterialPolynomial.TriState.frobenius_eq_id
          #print axioms MCore.FinalFail.MaterialPolynomial.SevenLaneVector.affine_injective
          #print axioms MCore.FinalFail.MaterialPolynomial.SevenLaneVector.hamming_affine
          EOF
          lake env lean /tmp/material_polynomial_audit.lean | tee audit/MATERIAL_POLYNOMIAL_AXIOMS.log
          ! grep -q 'sorryAx' audit/MATERIAL_POLYNOMIAL_AXIOMS.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-polynomial-${{ github.sha }}
          path: audit/MATERIAL_POLYNOMIAL_AXIOMS.log
          if-no-files-found: warn

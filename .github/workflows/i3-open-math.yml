name: I3 Open Math Audit

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'lean/MCore/OpenMath/I3Tristable.lean'
      - 'lean/MCore/OpenMath/IRegime.lean'
      - 'lean/MCore/OpenMath/IEnriched.lean'
      - 'open-math/i3-tristable/**'
      - 'lean/MCore/Research/UserProgram.lean'
      - 'lean/MCore/Research/UserProgram/**'
      - '.github/workflows/i3-open-math.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i3-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel build I3
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake env lean lean/MCore/OpenMath/IRegime.lean
          lake env lean lean/MCore/OpenMath/I3Tristable.lean
          lake env lean lean/MCore/OpenMath/IEnriched.lean
          lake build MCore.Research.UserProgram
          lake env lean lean/MCore/Research/UserProgram.lean
          cp lean/MCore/OpenMath/I3Tristable.lean /tmp/I3AxiomAudit.lean
          cat >> /tmp/I3AxiomAudit.lean <<'EOF'
          #print axioms MCore.OpenMath.I3.i3_final_theorem
          EOF
          lake env lean /tmp/I3AxiomAudit.lean
          cp lean/MCore/OpenMath/IEnriched.lean /tmp/IEnrichedAxiomAudit.lean
          cat >> /tmp/IEnrichedAxiomAudit.lean <<'EOF'
          #print axioms MCore.OpenMath.IEnriched.limit_resolution_compatible
          #print axioms MCore.OpenMath.IEnriched.lHospital_resolution_bridge
          #print axioms MCore.OpenMath.IEnriched.observables_complete
          EOF
          lake env lean /tmp/IEnrichedAxiomAudit.lean
      - name: Fail closed on placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(sorry|admit|sorryAx)\b' lean/MCore/OpenMath/IRegime.lean lean/MCore/OpenMath/I3Tristable.lean lean/MCore/OpenMath/IEnriched.lean; then
            exit 1
          fi
          echo I3_HYGIENE_GREEN

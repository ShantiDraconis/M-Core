name: atk-universal-multistate-signature

on:
  push:
    branches:
      - atk/universal-multistate-signature-20260926
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build universal multistate signature
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.UniversalMultistateSignature
          lake build MCore.ATK.StructuralCompleteness
          lake build MCore.ATK.TerminalCertificateReconciliation
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/FinalFail/UniversalMultistateSignature.lean; then exit 1; fi
          if grep -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/FinalFail/UniversalMultistateSignature.lean; then exit 1; fi
          printf 'import MCore.FinalFail.UniversalMultistateSignature\n#print axioms MCore.FinalFail.manifestations_structurally_equivalent\n#print axioms MCore.FinalFail.universal_multistate_structure_exists\n#print axioms MCore.FinalFail.manifestation_gap_shape\n#print axioms MCore.FinalFail.atk_multistate_manifestation_theorem\n#print axioms MCore.FinalFail.manifestation_evidence_from_structure\n#print axioms MCore.FinalFail.structural_theorem_firewall\n#print axioms MCore.ATK.exact_gap_ledger_structurally_complete\n#print axioms MCore.ATK.structuralOpenGaps_eq_zero\n#print axioms MCore.ATK.structural_closed_mathematical_open\n#print axioms MCore.ATK.terminal_reconciliation_firewall\n' > MultistateAxiomAudit.lean
          lake env lean MultistateAxiomAudit.lean 2>&1 | tee MultistateAxiomAudit.log
          if grep -E 'sorryAx' MultistateAxiomAudit.log; then exit 1; fi
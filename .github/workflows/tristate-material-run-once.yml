name: Tri-state material math certify

on:
  push:
    branches:
      - atk/material-math-tristate-20261001
    paths:
      - audit/TRISTATE_MATERIAL_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Strict source hygiene
        run: |
          set -euo pipefail
          FILES=(
            lean/MCore/MaterialMath/TriState/Core.lean
            lean/MCore/MaterialMath/TriState/Algebra.lean
            lean/MCore/MaterialMath/TriState/Dynamics.lean
            lean/MCore/MaterialMath/TriState/NumericClasses.lean
            lean/MCore/MaterialMath/TriState/Spectral.lean
            lean/MCore/MaterialMath/TriState/SymmetricAlgebra.lean
            lean/MCore/MaterialMath/TriState/Geometry.lean
            lean/MCore/MaterialMath/TriState/Differential.lean
            lean/MCore/MaterialMath/TriState/MetricTopology.lean
            lean/MCore/MaterialMath/TriState/OperationalAlgebra.lean
            lean/MCore/MaterialMath/TriState/Tripotent.lean
            lean/MCore/MaterialMath/TriState/HeatFlow.lean
            lean/MCore/MaterialMath/TriState/NoSmuggling.lean
            lean/MCore/MaterialMath/TerminalPatterns.lean
            lean/MCore/MaterialMath/Contraction.lean
            lean/MCore/MaterialMath/InternalTerminalProducers.lean
            lean/MCore/MaterialMath/UnconditionalRoot.lean
          )
          if grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' "${FILES[@]}"; then
            echo "ERROR: prohibited proof escape found"
            exit 1
          fi

      - name: Build complete material mathematics
        run: |
          set -euo pipefail
          lake build MCore.MaterialMath.TriState.Core
          lake build MCore.MaterialMath.TriState.Algebra
          lake build MCore.MaterialMath.TriState.Dynamics
          lake build MCore.MaterialMath.TriState.NumericClasses
          lake build MCore.MaterialMath.TriState.Spectral
          lake build MCore.MaterialMath.TriState.SymmetricAlgebra
          lake build MCore.MaterialMath.TriState.Geometry
          lake build MCore.MaterialMath.TriState.Differential
          lake build MCore.MaterialMath.TriState.MetricTopology
          lake build MCore.MaterialMath.TriState.OperationalAlgebra
          lake build MCore.MaterialMath.TriState.Tripotent
          lake build MCore.MaterialMath.TerminalPatterns
          lake build MCore.MaterialMath.Contraction
          lake build MCore.MaterialMath.InternalTerminalProducers
          lake build MCore.MaterialMath.TriState.HeatFlow
          lake build MCore.MaterialMath.UnconditionalRoot
          lake build MCore.MaterialMath.TriState.NoSmuggling

      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/tristate_audit.lean <<'EOF'
          import MCore.MaterialMath.TriState.HeatFlow
          import MCore.MaterialMath.TriState.NoSmuggling
          import MCore.MaterialMath.TriState.SymmetricAlgebra
          import MCore.MaterialMath.TriState.Geometry
          import MCore.MaterialMath.TriState.Differential
          import MCore.MaterialMath.TriState.MetricTopology
          import MCore.MaterialMath.TriState.OperationalAlgebra
          import MCore.MaterialMath.TriState.Tripotent
          import MCore.MaterialMath.InternalTerminalProducers
          import MCore.MaterialMath.UnconditionalRoot
          #print axioms MCore.MaterialMath.Phase3.rotate_three
          #print axioms MCore.MaterialMath.TriNumber.phaseSum_laplacian_zero
          #print axioms MCore.MaterialMath.TriDynamics.harmonic_iff_coherent
          #print axioms MCore.MaterialMath.TriArithmetic.center_balanced
          #print axioms MCore.MaterialMath.TriSpectral.spectral_split
          #print axioms MCore.MaterialMath.TriSymmetric.characteristic_rotate
          #print axioms MCore.MaterialMath.Phase3.rotate_adds_120_mod_360
          #print axioms MCore.MaterialMath.TriDifferential.laplacian_eq_forward_add_backward
          #print axioms MCore.MaterialMath.Phase3.cyclicDistance_ultrametric
          #print axioms MCore.MaterialMath.TriAlgebra.coordinate_decomposition
          #print axioms MCore.MaterialMath.TriPotent.I3_tripotent
          #print axioms MCore.MaterialMath.TriPotent.I3_annihilator
          #print axioms MCore.MaterialMath.geometric_bound
          #print axioms MCore.MaterialMath.internalProducerSuite_inhabited
          #print axioms MCore.MaterialMath.unconditionalMaterialRoot_inhabited
          #print axioms MCore.MaterialMath.I3Real_heat_vanishes
          #print axioms MCore.MaterialMath.TriHeat.halfStep_eq_half_of_balanced
          #print axioms MCore.MaterialMath.TriHeat.iterate_closed_form
          #print axioms MCore.MaterialMath.nonempty_materialInterpretation_iff_target
          EOF
          lake env lean /tmp/tristate_audit.lean | tee audit/TRISTATE_MATERIAL_AXIOMS.log
          ! grep -q 'sorryAx' audit/TRISTATE_MATERIAL_AXIOMS.log

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tristate-material-${{ github.sha }}
          path: audit/TRISTATE_MATERIAL_AXIOMS.log
          if-no-files-found: warn

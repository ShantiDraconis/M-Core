name: Tri-state material math certify

on:
  push:
    branches:
      - atk/material-math-tristate-20261001
    paths:
      - audit/TRISTATE_MATERIAL_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Strict source hygiene
        run: |
          set -euo pipefail
          FILES=(
            lean/MCore/MaterialMath/TriState/Core.lean
            lean/MCore/MaterialMath/TriState/Algebra.lean
            lean/MCore/MaterialMath/TriState/Dynamics.lean
            lean/MCore/MaterialMath/TriState/NumericClasses.lean
            lean/MCore/MaterialMath/TriState/NoSmuggling.lean
          )
          if grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' "${FILES[@]}"; then
            echo "ERROR: prohibited proof escape found"
            exit 1
          fi

      - name: Build tri-state material math
        run: |
          set -euo pipefail
          lake build MCore.MaterialMath.TriState.Core
          lake build MCore.MaterialMath.TriState.Algebra
          lake build MCore.MaterialMath.TriState.Dynamics
          lake build MCore.MaterialMath.TriState.NumericClasses
          lake build MCore.MaterialMath.TriState.NoSmuggling

      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/tristate_audit.lean <<'EOF'
          import MCore.MaterialMath.TriState.NumericClasses
          import MCore.MaterialMath.TriState.NoSmuggling
          #print axioms MCore.MaterialMath.Phase3.rotate_three
          #print axioms MCore.MaterialMath.TriNumber.rotate_three
          #print axioms MCore.MaterialMath.TriNumber.phaseSum_laplacian_zero
          #print axioms MCore.MaterialMath.TriDynamics.harmonic_iff_coherent
          #print axioms MCore.MaterialMath.TriArithmetic.center_balanced
          #print axioms MCore.MaterialMath.TriArithmetic.spreadEnergy_eq_zero_iff_coherent
          #print axioms MCore.MaterialMath.nonempty_materialInterpretation_iff_target
          #print axioms MCore.MaterialMath.triState_global_bridge_iff_global_root
          EOF
          lake env lean /tmp/tristate_audit.lean | tee audit/TRISTATE_MATERIAL_AXIOMS.log
          ! grep -q 'sorryAx' audit/TRISTATE_MATERIAL_AXIOMS.log

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tristate-material-${{ github.sha }}
          path: audit/TRISTATE_MATERIAL_AXIOMS.log
          if-no-files-found: warn

name: Material asymmetry stack one-shot

on:
  push:
    branches:
      - atk/global-material-frontier-20261001
    paths:
      - audit/MATERIAL_ASYMMETRY_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Source hygiene
        run: |
          set -euo pipefail
          FILES=(
            lean/MCore/FinalFail/MaterialAlgebra.lean
            lean/MCore/FinalFail/MaterialProducerCalculus.lean
            lean/MCore/FinalFail/MaterialDerived.lean
            lean/MCore/FinalFail/MaterialGeometry.lean
            lean/MCore/FinalFail/MaterialField.lean
            lean/MCore/FinalFail/MaterialGlobalAssembly.lean
            lean/MCore/FinalFail/TopologyOperatorCore.lean
            lean/MCore/FinalFail/TriadicObstructionCalculus.lean
            lean/MCore/FinalFail/MaterialAsymmetry.lean
          )
          if grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' "${FILES[@]}"; then
            echo "ERROR: prohibited proof escape found"
            exit 1
          fi
      - name: Build material asymmetry stack
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.MaterialAlgebra
          lake build MCore.FinalFail.MaterialProducerCalculus
          lake build MCore.FinalFail.MaterialDerived
          lake build MCore.FinalFail.MaterialGeometry
          lake build MCore.FinalFail.MaterialField
          lake build MCore.FinalFail.MaterialGlobalAssembly
          lake build MCore.FinalFail.TopologyOperatorCore
          lake build MCore.FinalFail.TriadicObstructionCalculus
          lake build MCore.FinalFail.MaterialAsymmetry
      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/material_asymmetry_audit.lean <<'EOF'
          import MCore.FinalFail.MaterialAsymmetry
          #print axioms MCore.FinalFail.MaterialAsymmetry.TriState.directedDiff_reverse
          #print axioms MCore.FinalFail.MaterialAsymmetry.TriState.directedDiff_chain
          #print axioms MCore.FinalFail.MaterialAsymmetry.TriState.dihedral_three_relations
          #print axioms MCore.FinalFail.MaterialAsymmetry.TriState.orientation_chain
          #print axioms MCore.FinalFail.MaterialAsymmetry.SevenLaneVector.directedDiff_chain
          #print axioms MCore.FinalFail.MaterialAsymmetry.SevenLaneVector.reflect_rotate_reflect
          #print axioms MCore.FinalFail.MaterialAsymmetry.SevenLaneVector.reflection_isometry
          EOF
          lake env lean /tmp/material_asymmetry_audit.lean | tee audit/MATERIAL_ASYMMETRY_AXIOMS.log
          ! grep -q 'sorryAx' audit/MATERIAL_ASYMMETRY_AXIOMS.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-asymmetry-${{ github.sha }}
          path: audit/MATERIAL_ASYMMETRY_AXIOMS.log
          if-no-files-found: warn

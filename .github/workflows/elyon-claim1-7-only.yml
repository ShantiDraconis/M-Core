name: ELYON Claim1-7 Only

on:
  push:
    branches:
      - elyon/claim1-7-only-20260924
  workflow_dispatch:

concurrency:
  group: elyon-claim1-7-only
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claim1-7-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean toolchain and packages
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: elyon-claim1-7-light-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            elyon-claim1-7-light-${{ runner.os }}-

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"

      - name: Resolve dependencies only if missing
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if [ ! -d .lake/packages/mathlib ]; then
            lake update
          else
            lake update
          fi

      - name: Verify Claim1-7 source
        shell: bash
        run: |
          set -euo pipefail
          test -f lean/MCore/Real/Claim1To7Only.lean
          test -f certs/elyon_claim1_7_only/manifest.json
          test -f certs/elyon_claim1_7_only/CLAIM1_7_CERTIFICATE.json
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/Real/Claim1To7Only.lean
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/Real/Claim1To7Only.lean

      - name: Kernel build Claim1-7 only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.Real.Claim1To7Only

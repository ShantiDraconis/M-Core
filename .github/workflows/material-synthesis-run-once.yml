name: Material synthesis one-shot

on:
  push:
    branches:
      - atk/global-material-frontier-20261001
    paths:
      - audit/MATERIAL_SYNTHESIS_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Source hygiene
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' lean/MCore/FinalFail/MaterialSynthesis.lean
      - name: Build synthesis
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.MaterialSynthesis
      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/material_synthesis_audit.lean <<'EOF'
          import MCore.FinalFail.MaterialSynthesis
          #print axioms MCore.FinalFail.MaterialSynthesis.TriState.delta_translate
          #print axioms MCore.FinalFail.MaterialSynthesis.TriState.delta_rho
          #print axioms MCore.FinalFail.MaterialSynthesis.TriState.nonzero_eq_one_or_neg_one
          #print axioms MCore.FinalFail.MaterialSynthesis.SevenLaneVector.rotate_eq_add_unitVector
          #print axioms MCore.FinalFail.MaterialSynthesis.SevenLaneVector.smul_injective_nonzero
          #print axioms MCore.FinalFail.MaterialSynthesis.EvidenceState.derivative_dual
          #print axioms MCore.FinalFail.MaterialSynthesis.EvidenceState.secondDerivative_dual
          #print axioms MCore.FinalFail.MaterialSynthesis.EvidenceState.jumpMagnitude_dual
          EOF
          lake env lean /tmp/material_synthesis_audit.lean | tee audit/MATERIAL_SYNTHESIS_AXIOMS.log
          ! grep -q 'sorryAx' audit/MATERIAL_SYNTHESIS_AXIOMS.log
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-synthesis-${{ github.sha }}
          path: audit/MATERIAL_SYNTHESIS_AXIOMS.log
          if-no-files-found: warn

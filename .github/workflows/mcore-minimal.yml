name: M-Core minimal four-theorem verification

on:
  push:
    paths:
      - 'MINIMAL/**'
      - '.github/workflows/mcore-minimal.yml'
  pull_request:
    paths:
      - 'MINIMAL/**'
      - '.github/workflows/mcore-minimal.yml'
  workflow_dispatch:

jobs:
  compile-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          build: false
          test: false
      - name: Compile each isolated theorem file
        run: |
          lake exe cache get
          for file in MINIMAL/A1.lean MINIMAL/A2.lean MINIMAL/G1Fix.lean MINIMAL/A3.lean; do
            echo "Checking $file"
            lake env lean "$file"
          done

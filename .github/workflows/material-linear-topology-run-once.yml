name: Material linear topology one-shot

on:
  push:
    branches:
      - atk/global-material-frontier-20261001
    paths:
      - audit/MATERIAL_LINEAR_TOPOLOGY_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Source hygiene
        run: |
          set -euo pipefail
          ! grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' lean/MCore/FinalFail/MaterialLinearTopology.lean
      - name: Build linear topology
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.MaterialLinearTopology
      - name: Axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/material_linear_topology_audit.lean <<'EOF'
          import MCore.FinalFail.MaterialLinearTopology
          #print axioms MCore.FinalFail.MaterialLinearTopology.TriState.support_mul_left_nonzero
          #print axioms MCore.FinalFail.MaterialLinearTopology.SevenLaneVector.coordinate_decomposition
          #print axioms MCore.FinalFail.MaterialLinearTopology.SevenLaneVector.supportCount_eq_hamming_zero
          #print axioms MCore.FinalFail.MaterialLinearTopology.SevenLaneVector.supportCount_smul_nonzero
          #print axioms MCore.FinalFail.MaterialLinearTopology.SevenLaneVector.hamming_smul_nonzero
          EOF
          lake env lean /tmp/material_linear_topology_audit.lean | tee audit/MATERIAL_LINEAR_TOPOLOGY_AXIOMS.log
          ! grep -q 'sorryAx' audit/MATERIAL_LINEAR_TOPOLOGY_AXIOMS.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-linear-topology-${{ github.sha }}
          path: audit/MATERIAL_LINEAR_TOPOLOGY_AXIOMS.log
          if-no-files-found: warn

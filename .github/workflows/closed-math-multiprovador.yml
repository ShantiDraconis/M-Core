name: Closed Math multiprovador (Coq, Isabelle, SMT, TPTP, Python)

on:
  push:
    paths:
      - 'formatos/**'
      - 'pesquisa/rodada5/**'
      - 'pesquisa/fracoes/**'
      - '.github/workflows/closed-math-multiprovador.yml'
  pull_request:
    paths:
      - 'formatos/**'
      - 'pesquisa/rodada5/**'
      - 'pesquisa/fracoes/**'
      - '.github/workflows/closed-math-multiprovador.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cada job grava a saída do verificador num arquivo e a publica como anotação (legível pela API),
# com o código de saída real do verificador.
env:
  ANOTA: |
    anota() {  # anota <arquivo> <título> <código>
      local msg
      msg=$(tail -c 3500 "$1" 2>/dev/null | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
      [ -n "$msg" ] || msg="(sem saída em $1)"
      if [ "$3" = "0" ]; then echo "::notice title=$2 OK::$msg"; else echo "::error title=$2 FALHOU ($3)::$msg"; fi
    }

jobs:
  coq:
    name: Coq (coqc + coqchk)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Coq (imagem coqorg/coq; alternativa apt)
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set +e
          IMG=""
          for tag in 8.20 8.19 8.18 latest; do
            if timeout 600 docker pull -q "coqorg/coq:$tag" > /dev/null 2>&1; then IMG="coqorg/coq:$tag"; break; fi
          done
          echo "COQ_IMG=$IMG" >> "$GITHUB_ENV"
          if [ -z "$IMG" ]; then
            sudo -E apt-get update -qq && timeout 1200 sudo -E apt-get install -y -qq --no-install-recommends coq > /dev/null
          fi
          echo "imagem: ${IMG:-apt}"
          true
      - name: coqc + coqchk
        working-directory: formatos/coq
        run: |
          eval "$ANOTA"
          set +e
          chmod -R a+rwX .
          RUN=""
          [ -n "$COQ_IMG" ] && RUN="docker run --rm -v $PWD:/work -w /work $COQ_IMG"
          { echo "coq: ${COQ_IMG:-apt}"; $RUN coqc --version; $RUN coqc -Q . ATK ClosedMath.v; echo "coqc=$?"; } > coq_saida.txt 2>&1
          c1=$(grep -o 'coqc=[0-9]*' coq_saida.txt | cut -d= -f2)
          $RUN coqchk -silent -o -Q . ATK ATK.ClosedMath > coqchk_saida.txt 2>&1; c2=$?
          anota coq_saida.txt "coqc" "$c1"
          anota coqchk_saida.txt "coqchk" "$c2"
          [ "$c1" = "0" ] && [ "$c2" = "0" ]

  isabelle:
    name: Isabelle/HOL (isabelle build)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: isabelle build (imagem oficial makarius/isabelle)
        run: |
          set +e
          eval "$ANOTA"
          : > isa_saida.txt
          IMG=""
          for tag in Isabelle2025 Isabelle2024 latest; do
            if docker pull -q "makarius/isabelle:$tag" >> isa_saida.txt 2>&1; then IMG="makarius/isabelle:$tag"; break; fi
          done
          echo "imagem: ${IMG:-nenhuma}" >> isa_saida.txt
          chmod -R a+rwX formatos/isabelle
          docker run --rm -v "$PWD/formatos/isabelle:/work" "$IMG" version >> isa_saida.txt 2>&1
          docker run --rm -v "$PWD/formatos/isabelle:/work" "$IMG" build -v -o threads=4 -D /work >> isa_saida.txt 2>&1; c=$?
          echo "build=$c" >> isa_saida.txt
          grep -n -i -A4 -E "imagem|Isabelle20|\*\*\*|failed|Finished|Timing|build=" isa_saida.txt | tail -80 > isa_resumo.txt
          [ -s isa_resumo.txt ] || tail -40 isa_saida.txt > isa_resumo.txt
          anota isa_resumo.txt "isabelle" "$c"
          exit $c

  smt:
    name: SMT-LIB 2 (z3, cvc5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar resolvedores
        run: |
          pip install -q z3-solver cvc5 || pip install -q z3-solver
          sudo apt-get update -qq && sudo apt-get install -y -qq z3 > /dev/null || true
      - name: rodar
        run: |
          eval "$ANOTA"
          set +e
          python3 formatos/smtlib/rodar.py > smt_saida.txt 2>&1; c=$?
          anota smt_saida.txt "smt" "$c"
          exit $c

  tptp:
    name: TPTP (E prover)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar provadores (SPASS, E, Vampire)
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq spass eprover > /dev/null
          # Só binários x86_64 que rodam neste runner (em 11/11/2026 o primeiro asset "linux" não era: Exec format error).
          curl -s https://api.github.com/repos/vprover/vampire/releases/latest | python3 -c "
          import json, sys
          a = json.load(sys.stdin).get('assets', [])
          ruim = ('arm', 'aarch64', 'mac', 'darwin', 'win')
          xs = [x for x in a if 'linux' in x['name'].lower() and not any(r in x['name'].lower() for r in ruim)]
          xs.sort(key=lambda x: not any(k in x['name'].lower() for k in ('x86_64', 'x64', 'amd64', 'static')))
          print('\\n'.join(x['browser_download_url'] for x in xs))" > vamp_urls.txt
          while read -r url; do
            [ -n "$url" ] || continue
            rm -rf vamp && mkdir -p vamp && curl -sL -o vamp/pkg "$url"
            (cd vamp && (unzip -q pkg 2>/dev/null || tar xf pkg 2>/dev/null || cp pkg vampire))
            for v in $(find vamp -type f -name 'vampire*' ! -name pkg); do
              chmod +x "$v"
              if "$v" --version > /dev/null 2>&1; then
                echo "VAMPIRE=$PWD/$v" >> "$GITHUB_ENV"; echo "vampire: $url ($v)"; break 2
              fi
            done
          done < vamp_urls.txt
          true
      - name: rodar
        run: |
          eval "$ANOTA"
          set +e
          bash formatos/tptp/rodar.sh > tptp_saida.txt 2>&1; c=$?
          anota tptp_saida.txt "tptp" "$c"
          exit $c

  python:
    name: Python (pytest + SymPy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install -q numpy scipy matplotlib sympy pytest
      - name: pytest
        run: |
          eval "$ANOTA"
          set +e
          python -m pytest -q -rs pesquisa/rodada5/testes pesquisa/fracoes/testes > py_saida.txt 2>&1; c=$?
          anota py_saida.txt "pytest" "$c"
          exit $c

name: Closed Math multiprovador (Coq, Isabelle, SMT, TPTP, Python)

on:
  push:
    paths:
      - 'formatos/**'
      - 'pesquisa/rodada5/**'
      - '.github/workflows/closed-math-multiprovador.yml'
  pull_request:
    paths:
      - 'formatos/**'
      - 'pesquisa/rodada5/**'
      - '.github/workflows/closed-math-multiprovador.yml'
  workflow_dispatch:

permissions:
  contents: read

# Cada job grava a saída do verificador num arquivo e a publica como anotação (legível pela API),
# com o código de saída real do verificador.
env:
  ANOTA: |
    anota() {  # anota <arquivo> <título> <código>
      local msg
      msg=$(tail -c 3500 "$1" 2>/dev/null | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
      [ -n "$msg" ] || msg="(sem saída em $1)"
      if [ "$3" = "0" ]; then echo "::notice title=$2 OK::$msg"; else echo "::error title=$2 FALHOU ($3)::$msg"; fi
    }

jobs:
  coq:
    name: Coq (coqc + coqchk)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Coq
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo -E apt-get update -qq && sudo -E apt-get install -y -qq --no-install-recommends coq > /dev/null
      - name: coqc + coqchk
        working-directory: formatos/coq
        run: |
          eval "$ANOTA"
          set +e
          { coqc --version; coqc -Q . ATK ClosedMath.v; echo "coqc=$?"; } > coq_saida.txt 2>&1
          c1=$(grep -o 'coqc=[0-9]*' coq_saida.txt | cut -d= -f2)
          coqchk -silent -o -Q . ATK ATK.ClosedMath > coqchk_saida.txt 2>&1; c2=$?
          anota coq_saida.txt "coqc" "$c1"
          anota coqchk_saida.txt "coqchk" "$c2"
          [ "$c1" = "0" ] && [ "$c2" = "0" ]

  isabelle:
    name: Isabelle/HOL (isabelle build)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Isabelle
        timeout-minutes: 45
        run: |
          eval "$ANOTA"
          : > baixar.txt
          for v in Isabelle2025 Isabelle2024; do
            for base in https://isabelle.in.tum.de/dist https://www.cl.cam.ac.uk/research/hvg/Isabelle/dist https://mirror.cse.unsw.edu.au/pub/isabelle/dist; do
              url="$base/${v}_linux.tar.gz"
              curl -fL --retry 2 --connect-timeout 30 --max-time 1200 -s -o isa.tar.gz "$url"; c=$?
              echo "$url -> curl $c ($(stat -c %s isa.tar.gz 2>/dev/null || echo 0) bytes)" >> baixar.txt
              if [ $c = 0 ] && tar xzf isa.tar.gz; then echo "ISA=$PWD/$v" >> "$GITHUB_ENV"; break 2; fi
            done
          done
          anota baixar.txt "isabelle-download" 0
      - name: isabelle build
        run: |
          eval "$ANOTA"
          set +e
          { "$ISA/bin/isabelle" version; "$ISA/bin/isabelle" build -v -o threads=4 -D formatos/isabelle; echo "build=$?"; } > isa_saida.txt 2>&1
          c=$(grep -o 'build=[0-9]*' isa_saida.txt | tail -1 | cut -d= -f2)
          grep -n -i -E "error|failed|Finished|Building|Timing|theory" isa_saida.txt | tail -60 > isa_resumo.txt
          anota isa_resumo.txt "isabelle" "$c"
          [ "$c" = "0" ]

  smt:
    name: SMT-LIB 2 (z3, cvc5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar resolvedores
        run: |
          pip install -q z3-solver cvc5 || pip install -q z3-solver
          sudo apt-get update -qq && sudo apt-get install -y -qq z3 > /dev/null || true
      - name: rodar
        run: |
          eval "$ANOTA"
          set +e
          python3 formatos/smtlib/rodar.py > smt_saida.txt 2>&1; c=$?
          anota smt_saida.txt "smt" "$c"
          exit $c

  tptp:
    name: TPTP (E prover)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar E
        run: sudo apt-get update -qq && sudo apt-get install -y -qq eprover > /dev/null
      - name: rodar
        run: |
          eval "$ANOTA"
          set +e
          bash formatos/tptp/rodar.sh > tptp_saida.txt 2>&1; c=$?
          anota tptp_saida.txt "tptp" "$c"
          exit $c

  python:
    name: Python (pytest + SymPy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: pip install -q numpy scipy matplotlib sympy pytest
      - name: pytest
        run: |
          eval "$ANOTA"
          set +e
          python -m pytest -q -rs pesquisa/rodada5/testes > py_saida.txt 2>&1; c=$?
          anota py_saida.txt "pytest" "$c"
          exit $c

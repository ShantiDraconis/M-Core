name: M-Core V2 Closed System

on:
  push:
    branches:
      - audit/closed-chain-v2.1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record observed HEAD
        run: |
          git rev-parse HEAD
          git rev-parse HEAD > V21_OBSERVED_HEAD.txt

      - name: Source firewall
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' MCore/V21 MCore/V22 --include='*.lean'; then
            echo "forbidden proof placeholder found"
            exit 1
          fi
          if grep -R -n -E '^(axiom|constant|constants)[[:space:]]' MCore/V21 MCore/V22 --include='*.lean'; then
            echo "unaccounted declaration-level axiom/constant found"
            exit 1
          fi
          if grep -R -n -E 'Option\.none' MCore/V21 MCore/V22 --include='*.lean'; then
            echo "Option.none found in closed-chain core"
            exit 1
          fi

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Lake build
        shell: bash
        run: |
          set -euo pipefail
          lake build

      - name: Reproduce V2.1 certificate tests
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MCore/V21/CertificateTests.lean | tee V21_AXIOMS.log
          grep -F "greenControls_closed' depends on axioms: [propext]" V21_AXIOMS.log
          grep -F "badHead_fails_closed' depends on axioms: [propext]" V21_AXIOMS.log
          grep -F "placebo_fails_closed' depends on axioms: [propext]" V21_AXIOMS.log
          grep -F "blockingResidue_fails_closed' depends on axioms: [propext]" V21_AXIOMS.log
          grep -F "demo_chain_closes' depends on axioms: [propext]" V21_AXIOMS.log
          if grep -F "depends on axioms:" V21_AXIOMS.log | grep -v -F "[propext]"; then
            echo "unexpected non-allowlisted axiom dependency"
            exit 1
          fi

      - name: Reproduce V2.2 matrix tests
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MCore/V22/Tests.lean | tee V22_AXIOMS.log
          grep -F "node_count_is_39" V22_AXIOMS.log
          grep -F "relation_count_is_1521" V22_AXIOMS.log
          grep -F "open_open_classifies" V22_AXIOMS.log
          grep -F "false_true_is_both_closed" V22_AXIOMS.log
          grep -F "indeterminate_absorbs_left" V22_AXIOMS.log
          grep -F "indeterminate_absorbs_right" V22_AXIOMS.log

name: M-Core V2 Closed System

on:
  push:
    branches:
      - audit/closed-chain-v2.1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record observed HEAD
        run: |
          git rev-parse HEAD
          git rev-parse HEAD > V21_OBSERVED_HEAD.txt

      - name: Source firewall
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' MCore/V21 MCore/V22 --include='*.lean'; then
            echo "forbidden proof placeholder found"
            exit 1
          fi
          if grep -R -n -E '^(axiom|constant|constants)[[:space:]]' MCore/V21 MCore/V22 --include='*.lean'; then
            echo "unaccounted declaration-level axiom/constant found"
            exit 1
          fi
          if grep -R -n -E 'Option\.none' MCore/V21 MCore/V22 --include='*.lean'; then
            echo "Option.none found in closed-chain core"
            exit 1
          fi

      - name: Validate frontier certificate index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p = Path("certificates/FRONTIER_CERTIFICATE_INDEX_2026-09-19.json")
          d = json.loads(p.read_text())
          certs = d["certificates"]
          assert d["schema"] == "mcore.frontier.certificate.index.v1"
          assert d["certificate_count"] == len(certs)
          assert len({x["repo"] for x in certs}) == len(certs)
          sha = re.compile(r"^[0-9a-f]{40}$")
          for x in certs:
              assert x["conclusion"] == "SUCCESS", x
              assert x["no_mathematical_promotion"] is True, x
              assert sha.fullmatch(x["certificate_commit"]), x
              assert sha.fullmatch(x["certified_source_sha"]), x
              assert isinstance(x["workflow_run"], int) and x["workflow_run"] > 0, x
              assert isinstance(x["workflow_job"], int) and x["workflow_job"] > 0, x
              assert x["mathematical_endpoint_status"] in {"OPEN","MIXED_OPEN_CLOSED_BY_PROBLEM"}, x
          assert any(x["problem"] == "Navier-Stokes" and x["status"].startswith("PENDING_") for x in d["pending"])
          print(f"CERTIFICATE_INDEX_GREEN={len(certs)}")
          PY

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Targeted V2 build
        shell: bash
        run: |
          set -euo pipefail
          lake build MCore.V21.CertificateTests MCore.V22.Tests MCore.V22.FrontierRegistry MCore.V22.FrontierKernel

      - name: Reproduce V2.1 certificate tests
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MCore/V21/CertificateTests.lean | tee V21_AXIOMS.log
          grep -F "greenControls_closed' depends on axioms: [propext]" V21_AXIOMS.log
          grep -F "badHead_fails_closed' depends on axioms: [propext]" V21_AXIOMS.log
          grep -F "placebo_fails_closed' depends on axioms: [propext]" V21_AXIOMS.log
          grep -F "blockingResidue_fails_closed' depends on axioms: [propext]" V21_AXIOMS.log
          grep -F "demo_chain_closes' depends on axioms: [propext]" V21_AXIOMS.log
          if grep -F "depends on axioms:" V21_AXIOMS.log | grep -v -F "[propext]"; then
            echo "unexpected non-allowlisted axiom dependency"
            exit 1
          fi

      - name: Reproduce V2.2 matrix tests
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MCore/V22/Tests.lean | tee V22_AXIOMS.log
          grep -F "node_count_is_39" V22_AXIOMS.log
          grep -F "relation_count_is_1521" V22_AXIOMS.log
          grep -F "open_open_classifies" V22_AXIOMS.log
          grep -F "false_true_is_both_closed" V22_AXIOMS.log
          grep -F "indeterminate_absorbs_left" V22_AXIOMS.log
          grep -F "indeterminate_absorbs_right" V22_AXIOMS.log

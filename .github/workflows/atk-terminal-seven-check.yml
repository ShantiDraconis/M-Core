name: ATK terminal seven interface check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lean/ATK/TerminalSevenInterfaces.lean'
      - '.github/workflows/atk-terminal-seven-check.yml'
  push:
    branches:
      - atk/sync-existing-none-results-20261008
    paths:
      - 'lean/ATK/TerminalSevenInterfaces.lean'
      - '.github/workflows/atk-terminal-seven-check.yml'
jobs:
  terminal-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check standalone terminal interface
        run: lean lean/ATK/TerminalSevenInterfaces.lean
      - name: Reject proof holes and custom axioms
        run: |
          if grep -nE '(^|[[:space:]])(sorry|admit|axiom)[[:space:]]' lean/ATK/TerminalSevenInterfaces.lean; then
            echo 'Forbidden proof hole or axiom detected'
            exit 1
          fi

name: Material master strict one-shot

on:
  push:
    branches:
      - atk/global-material-frontier-20261001
    paths:
      - audit/MATERIAL_MASTER_STRICT_RUN_ONCE

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
      - name: Strict source hygiene
        run: |
          set -euo pipefail
          FILES=(
            lean/MCore/FinalFail/GlobalPositiveMaterialFrontier.lean
            lean/MCore/FinalFail/MaterialAlgebra.lean
            lean/MCore/FinalFail/MaterialProducerCalculus.lean
            lean/MCore/FinalFail/MaterialDerived.lean
            lean/MCore/FinalFail/MaterialGeometry.lean
            lean/MCore/FinalFail/MaterialField.lean
            lean/MCore/FinalFail/MaterialGlobalAssembly.lean
            lean/MCore/FinalFail/MaterialAsymmetry.lean
            lean/MCore/FinalFail/MaterialPolynomial.lean
            lean/MCore/FinalFail/MaterialSynthesis.lean
            lean/MCore/FinalFail/MaterialArithmetic.lean
            lean/MCore/FinalFail/MaterialLinearTopology.lean
          )
          if grep -nE '\b(sorry|admit)\b|^[[:space:]]*(axiom|constant)[[:space:]]' "${FILES[@]}"; then
            echo "ERROR: prohibited proof escape found"
            exit 1
          fi
      - name: Build complete material stack
        run: |
          set -euo pipefail
          lake build MCore.FinalFail.GlobalPositiveMaterialFrontier
          lake build MCore.FinalFail.MaterialAlgebra
          lake build MCore.FinalFail.MaterialProducerCalculus
          lake build MCore.FinalFail.MaterialDerived
          lake build MCore.FinalFail.MaterialGeometry
          lake build MCore.FinalFail.MaterialField
          lake build MCore.FinalFail.MaterialGlobalAssembly
          lake build MCore.FinalFail.MaterialAsymmetry
          lake build MCore.FinalFail.MaterialPolynomial
          lake build MCore.FinalFail.MaterialSynthesis
          lake build MCore.FinalFail.MaterialArithmetic
          lake build MCore.FinalFail.MaterialLinearTopology
      - name: Master axiom audit
        run: |
          set -euo pipefail
          cat > /tmp/material_master_audit.lean <<'EOF'
          import MCore.FinalFail.MaterialGlobalAssembly
          import MCore.FinalFail.MaterialAsymmetry
          import MCore.FinalFail.MaterialPolynomial
          import MCore.FinalFail.MaterialSynthesis
          import MCore.FinalFail.MaterialArithmetic
          import MCore.FinalFail.MaterialLinearTopology
          #print axioms MCore.FinalFail.Semantic.global_positive_root_iff_components
          #print axioms MCore.FinalFail.MaterialAlgebra.TriState.add_assoc
          #print axioms MCore.FinalFail.MaterialField.TriState.fieldCertificate
          #print axioms MCore.FinalFail.MaterialDerived.TriState.characteristic_three
          #print axioms MCore.FinalFail.MaterialDerived.EvidenceState.closure_idempotent
          #print axioms MCore.FinalFail.MaterialGeometry.SevenLaneVector.hamming_eq_zero_iff
          #print axioms MCore.FinalFail.MaterialGlobalAssembly.producer_root_roundtrip
          #print axioms MCore.FinalFail.MaterialAsymmetry.TriState.dihedral_three_relations
          #print axioms MCore.FinalFail.MaterialPolynomial.TriState.every_unary_operator_is_quadratic
          #print axioms MCore.FinalFail.MaterialPolynomial.TriState.affine_bijective
          #print axioms MCore.FinalFail.MaterialSynthesis.SevenLaneVector.smul_injective_nonzero
          #print axioms MCore.FinalFail.MaterialArithmetic.TriState.ofNat_add_three
          #print axioms MCore.FinalFail.MaterialLinearTopology.SevenLaneVector.coordinate_decomposition
          #print axioms MCore.FinalFail.MaterialLinearTopology.SevenLaneVector.hamming_smul_nonzero
          EOF
          lake env lean /tmp/material_master_audit.lean | tee audit/MATERIAL_MASTER_STRICT_AXIOMS.log
          ! grep -q 'sorryAx' audit/MATERIAL_MASTER_STRICT_AXIOMS.log
      - name: Upload master audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-master-strict-${{ github.sha }}
          path: audit/MATERIAL_MASTER_STRICT_AXIOMS.log
          if-no-files-found: warn

name: Teste do portão (casos plantados)

# 12 casos (4 limpos, 8 com defeito) contra o grep antigo, a busca nova, o aviso do log, o portão do
# M-Core (check_axioms.py), o detector de vazios do MVEI e o verificador de referência. Só Lean core.
on:
  push:
    paths:
      - 'audit/testes_portao/**'
      - 'atk-kernel/scripts/check_axioms.py'
      - '.github/scripts/sem_sorry.py'
      - '.github/workflows/testes-portao.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: audit/testes_portao
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Rodar os casos
        run: |
          lean --version
          python3 rodar.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-portao
          path: |
            audit/testes_portao/resultados.json
            audit/testes_portao/resultados.md

name: M-Core Structural Logic Certificate Gate

on:
  push:
    branches:
      - attack/multistate-signature-20260926
    paths:
      - 'lean/MCore/FinalFail/ProblemSignature.lean'
      - 'lean/MCore/FinalFail/SevenLocalNuclei.lean'
      - 'lean/MCore/FinalFail/SevenProblemSignatures.lean'
      - 'lean/MCore/UniversalMultistateEvidence.lean'
      - '.github/workflows/mcore-multistate-signature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.19.0
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fail-closed source hygiene
        run: |
          set -euo pipefail
          files=(
            lean/MCore/FinalFail/ProblemSignature.lean
            lean/MCore/FinalFail/SevenLocalNuclei.lean
            lean/MCore/FinalFail/SevenProblemSignatures.lean
            lean/MCore/UniversalMultistateEvidence.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"; then
            exit 1
          fi
          if grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "${files[@]}"; then
            exit 1
          fi

      - name: Kernel compile structural logic
        run: |
          set -euo pipefail
          cd lean
          export LEAN_PATH="$PWD"
          lean -o MCore/FinalFail/ProblemSignature.olean MCore/FinalFail/ProblemSignature.lean
          lean -o MCore/FinalFail/SevenLocalNuclei.olean MCore/FinalFail/SevenLocalNuclei.lean
          lean -o MCore/FinalFail/SevenProblemSignatures.olean MCore/FinalFail/SevenProblemSignatures.lean
          lean MCore/UniversalMultistateEvidence.lean 2>&1 | tee /tmp/structural-logic.log

      - name: Axiom footprint
        run: |
          set -euo pipefail
          test "$(grep -c 'does not depend on any axioms' /tmp/structural-logic.log || true)" -ge 4
          if grep -q 'sorryAx' /tmp/structural-logic.log; then exit 1; fi
          echo "MCORE_STRUCTURAL_LOGIC=GREEN"

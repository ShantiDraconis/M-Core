name: research final external minimal

on:
  push:
    branches:
      - research/single-45bf2597-final-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Kernel gate final external branch
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          files=(
            lean/MCore/Research/FinalExternalBranch.lean
            research/final-external/manifest.json
            research/final-external/status.json
          )
          for f in "${files[@]}"; do test -f "$f"; done
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/Research/FinalExternalBranch.lean
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/Research/FinalExternalBranch.lean
          lake build MCore.Research.FinalExternalBranch

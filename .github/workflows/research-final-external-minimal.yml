name: research final external minimal

on:
  push:
    branches:
      - research/seven-certs-final-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          elan default "$(cat lean-toolchain)"
          lake update

      - name: Verify sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lean/MCore/Research/FinalExternalBranch.lean
            lean/MCore/Real/BridgeSeven.lean
            lean/MCore/Real/SevenRealProducer.lean
            lean/MCore/Real/SevenExternalCertificate.lean
            research/final-external/manifest.json
            research/final-external/status.json
          )
          for f in "${files[@]}"; do test -f "$f"; done
          lean_files=(
            lean/MCore/Research/FinalExternalBranch.lean
            lean/MCore/Real/BridgeSeven.lean
            lean/MCore/Real/SevenRealProducer.lean
            lean/MCore/Real/SevenExternalCertificate.lean
          )
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${lean_files[@]}"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "${lean_files[@]}"

      - name: Kernel build
        shell: bash
        run: |
          set -euo pipefail
          lake build MCore.Research.FinalExternalBranch
          lake build MCore.Real.BridgeSeven
          lake build MCore.Real.SevenRealProducer
          lake build MCore.Real.SevenExternalCertificate

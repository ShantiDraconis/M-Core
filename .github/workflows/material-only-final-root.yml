name: Material Only Final Root

on:
  push:
    branches:
      - atk/material-only-final-root-20260930
    paths:
      - 'lean/MCore/FinalFail/**'
      - 'certs/final_external/v1/**'
      - '.github/workflows/material-only-final-root.yml'
      - 'lakefile.lean'
      - 'lean-toolchain'

permissions:
  contents: read
  actions: read

jobs:
  material-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Build material-only cut
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.FinalFail.MaterialOnlyFinalRoot
          lake build MCore.FinalFail.Master

      - name: Validate preparatory external package
        shell: bash
        run: |
          set -euo pipefail
          bash certs/final_external/v1/freeze.sh

      - name: Verify FINAL_ROOT gate fails closed while blockers remain
        shell: bash
        run: |
          set +e
          bash certs/final_external/v1/finalize_root.sh > /tmp/finalize.log 2>&1
          rc=$?
          cat /tmp/finalize.log
          test "$rc" -eq 2
          grep -F "FINAL_ROOT_BLOCKED" /tmp/finalize.log
          test ! -e certs/final_external/v1/FINAL_ROOT

      - name: Reject proof escapes
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\\b(sorry|admit|sorryAx)\\b' --include='*.lean' lean/MCore/FinalFail; then
            echo "FAIL_CLOSED: proof escape detected"
            exit 1
          fi
          if grep -RInE '^[[:space:]]*(@\\[[^]]*\\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean/MCore/FinalFail; then
            echo "FAIL_CLOSED: axiom declaration detected"
            exit 1
          fi
          echo "MATERIAL_ONLY_HYGIENE_GREEN"

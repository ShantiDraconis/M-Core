name: "ATK-NS — verificação independente de Navier–Stokes (Clay C e D)"

on:
  push:
    paths:
      - 'atk-ns/**'
      - '.github/workflows/atk-ns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: Lean 4.34.0-rc2 + Mathlib + NavierStokesAndEuler (OpenAI) — compilação e auditoria de axiomas
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    defaults:
      run:
        working-directory: atk-ns
    steps:
      # a Mathlib compilada + os ~640 módulos da OpenAI não cabem no disco padrão do runner
      # (a execução 38654150987 parou com "No space left on device")
      - name: Liberar espaço em disco
        shell: bash
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - name: Instalar elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Versões
        shell: bash
        run: |
          mkdir -p reports
          lean --version | tee reports/toolchain.txt
          lake --version

      - name: Baixar Mathlib já compilada (cache oficial)
        shell: bash
        run: |
          lake exe cache get || (lake update && lake exe cache get)

      - name: lake build
        shell: bash
        continue-on-error: true
        run: |
          set +e
          lake build 2>&1 | tee reports/build.log
          rc=${PIPESTATUS[0]}
          n=$(grep -c "Built NavierStokes" reports/build.log || true)
          echo "::notice title=prova da OpenAI compilada no CI::$n módulos NavierStokes compilados do código-fonte nesta execução (0 = artefatos baixados); lake build saiu com $rc"
          # os logs brutos não são legíveis de fora; os primeiros erros vão como anotações
          { grep -E "^error: |: error" reports/build.log || true; } | head -8 | while IFS= read -r l; do
            echo "::error title=lake build::${l:0:900}"
          done
          exit $rc

      - name: Auditoria por arquivo
        shell: bash
        run: |
          for f in AtkNS/*.lean; do
            r=${f//\//_}
            if lake env lean "$f" > "reports/audit_${r}.log" 2>&1; then
              echo OK > "reports/status_${r}.txt"
            else
              echo FAIL > "reports/status_${r}.txt"
            fi
            cat "reports/audit_${r}.log"
            { grep -E ": error" "reports/audit_${r}.log" || true; } | head -4 | while IFS= read -r l; do
              echo "::error title=auditoria ${f}::${l:0:900}"
            done
          done
          cp lake-manifest.json reports/ || true

      - name: Relatório de certificação
        shell: bash
        run: |
          set +e
          python3 scripts/check_axioms.py
          code=$?
          cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atk-ns-report
          path: atk-ns/reports

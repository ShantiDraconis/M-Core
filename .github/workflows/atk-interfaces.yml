name: ATK interfaces kernel check

on:
  push:
    paths:
      - 'atk-interfaces/**'
      - '.github/workflows/atk-interfaces.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interfaces:
    name: Interfaces terminais (12/10) — kernel e axiomas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: atk-interfaces
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Instalar elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib v4.34.1 (cache)
        run: |
          lean --version
          lake exe cache get || (lake update && lake exe cache get)
      - name: lake build
        continue-on-error: true
        run: lake build 2>&1 | tail -40
      - name: Compilar e auditar
        run: python3 scripts/check_legacy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atk-interfaces-report
          path: atk-interfaces/reports/

name: Tooling - pacote Mathlib d13f23b

on:
  push:
    branches: ['atk/kernel-21-registros']
    paths: ['.github/workflows/tooling-mathlib.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacote:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: projeto
        run: |
          mkdir harness && cd harness
          echo "leanprover/lean4:v4.34.1" > lean-toolchain
          cat > lakefile.lean <<'LF'
          import Lake
          open Lake DSL
          package harness
          require mathlib from git "https://github.com/leanprover-community/mathlib4.git" @ "d13f23b723b8a846827a245b89c10fc7d3f11612"
          LF
          sed -i 's/^          //' lakefile.lean
          lake update
          lake exe cache get
          echo 'import Mathlib' > T.lean && lake env lean T.lean && echo OK_IMPORT
          du -sh .lake/packages
      - name: empacotar
        run: |
          cd harness
          tar -cf - lakefile.lean lean-toolchain lake-manifest.json .lake/packages | zstd -T0 -6 -o ../mathlib-d13f23b.tar.zst
          cd .. && ls -la mathlib-d13f23b.tar.zst
          split -b 1900m -d mathlib-d13f23b.tar.zst mathlib-d13f23b.tar.zst.part
          sha256sum mathlib-d13f23b.tar.zst.part* > SHA256SUMS
          cat SHA256SUMS
      - name: publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete atk-tooling-mathlib-d13f23b -R ${{ github.repository }} -y --cleanup-tag 2>/dev/null || true
          gh release create atk-tooling-mathlib-d13f23b -R ${{ github.repository }} --prerelease --target ${{ github.sha }} \
            --title "Ferramenta: oleans da Mathlib d13f23b (Lean 4.34.1)" \
            --notes "Pacote de build para verificação local. Não é um resultado matemático; pode ser apagado." \
            mathlib-d13f23b.tar.zst.part* SHA256SUMS
